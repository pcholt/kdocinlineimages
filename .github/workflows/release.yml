name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and check coverage
        run: ./gradlew test koverVerify

      - name: Build and sign plugin distribution
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew signPlugin

      - name: Verify the signature
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
        run: ./gradlew verifyPluginSignature

      - name: Check the tag matches the built version
        run: test -f "build/distributions/KDocInlineImages-${GITHUB_REF_NAME#v}-signed.zip"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          "build/distributions/KDocInlineImages-${GITHUB_REF_NAME#v}-signed.zip"
          --title "$GITHUB_REF_NAME"
          --generate-notes
