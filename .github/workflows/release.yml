name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and check coverage
        run: ./gradlew test koverVerify

      - name: Build plugin distribution
        run: ./gradlew buildPlugin

      - name: Check the tag matches the built version
        run: test -f "build/distributions/KDocInlineImages-${GITHUB_REF_NAME#v}.zip"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          "build/distributions/KDocInlineImages-${GITHUB_REF_NAME#v}.zip"
          --title "$GITHUB_REF_NAME"
          --generate-notes
